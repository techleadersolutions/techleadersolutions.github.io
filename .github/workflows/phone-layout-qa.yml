name: Phone layout QA
on:
  push:
    branches: [qa-article-cards-phone]
permissions:
  contents: read
jobs:
  phone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - run: |
          python - <<'PY'
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          from threading import Thread
          from playwright.sync_api import sync_playwright
          
          class QuietHandler(SimpleHTTPRequestHandler):
              def log_message(self, *args):
                  pass
          
          server = ThreadingHTTPServer(('127.0.0.1', 0), QuietHandler)
          Thread(target=server.serve_forever, daemon=True).start()
          base = f'http://127.0.0.1:{server.server_port}'
          with sync_playwright() as p:
              browser = p.chromium.launch(args=['--no-sandbox'])
              for width in [320, 375, 390, 430, 1440]:
                  mobile = width < 500
                  ctx = browser.new_context(viewport={'width':width,'height':850}, is_mobile=mobile, has_touch=mobile, reduced_motion='reduce')
                  page = ctx.new_page()
                  for path, shelf, heading in [('/', '#home-articles-track','h4'), ('/media.html','#articles-shelf','h3')]:
                      page.goto(base + path)
                      track = page.locator(shelf)
                      track.wait_for()
                      assert page.evaluate('document.documentElement.scrollWidth <= innerWidth'), (width, path, 'page overflow')
                      assert track.locator('article').count() == 9
                      assert track.locator(f'{heading} + .article-meta').count() == 9
                      next_button = page.get_by_role('button', name='Next articles', exact=True)
                      next_button.tap() if mobile else next_button.click()
                      page.wait_for_function('(shelf) => document.querySelector(shelf).scrollLeft > 0', arg=shelf)
                      if mobile:
                          page.get_by_role('button', name='Previous articles', exact=True).tap()
                          page.wait_for_function('(shelf) => document.querySelector(shelf).scrollLeft <= 2', arg=shelf)
                          track.scroll_into_view_if_needed()
                          box = track.bounding_box()
                          cdp = ctx.new_cdp_session(page)
                          x = int(box['x'] + box['width'] * .82)
                          y = int(box['y'] + min(110, box['height'] / 2))
                          cdp.send('Input.dispatchTouchEvent', {'type':'touchStart','touchPoints':[{'x':x,'y':y}]})
                          for distance in range(30, 211, 30):
                              cdp.send('Input.dispatchTouchEvent', {'type':'touchMove','touchPoints':[{'x':x-distance,'y':y}]})
                          cdp.send('Input.dispatchTouchEvent', {'type':'touchEnd','touchPoints':[]})
                          page.wait_for_function('(shelf) => document.querySelector(shelf).scrollLeft > 0', arg=shelf)
                      link = page.get_by_role('link', name='View all articles', exact=True)
                      link.tap() if mobile else link.click()
                      assert page.locator('#gallery-format').input_value() == 'Articles'
                      assert page.locator('.media-grid article:not([hidden])').count() == page.locator('.media-grid article[data-format="Articles"]').count()
                  print(f'{width}px: homepage and gallery passed', flush=True)
                  ctx.close()
          PY
