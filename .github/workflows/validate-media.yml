name: Validate media updates

on:
  pull_request:
    paths:
      - 'media/**'
      - 'index.html'
      - 'media.html'
      - '.github/workflows/validate-media.yml'
  push:
    branches:
      - media-system-phase1-clean
    paths:
      - 'media/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate media records and manifest
        run: node media/validate-media.js
      - name: Check historical evidence handling and catalog loading
        run: node media/test-archive-gaps.js
      - name: Check static archive and search metadata parity
        run: python3 media/audit-rendering.py
