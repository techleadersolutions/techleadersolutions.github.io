name: Validate media updates

on:
  pull_request:
    paths:
      - 'media/**'
  push:
    branches:
      - media-system-v2
    paths:
      - 'media/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate media records and manifest
        run: node media/validate-media.js
